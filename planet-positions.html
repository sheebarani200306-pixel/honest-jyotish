<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honest Jyotish - Planet Positions</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7f3eb;
  color: #29231d;
  margin: 0;
  padding: 18px;
}
.container {
  max-width: 650px;
  margin: auto;
}
h1 {
  text-align: center;
  color: #70421e;
}
.card {
  background: white;
  padding: 16px;
  margin: 14px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000012;
}
button {
  background: #75451f;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 13px 18px;
  font-size: 16px;
  width: 100%;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  font-size: 14px;
}
th, td {
  padding: 10px 5px;
  border-bottom: 1px solid #e5ddd2;
  text-align: left;
}
th {
  background: #eee3d3;
}
.small {
  color: #71685e;
  font-size: 13px;
  line-height: 1.5;
}
#status {
  white-space: pre-wrap;
  line-height: 1.5;
}
</style>
</head>

<body>
<div class="container">

<h1>✦ Honest Jyotish ✦</h1>

<div class="card">
  <h2>Planetary Positions</h2>
  <div id="birthInfo" class="small"></div>
  <p id="status">Ready to calculate.</p>
  <button id="calculateButton">Calculate Positions</button>
</div>

<div class="card" id="birthNakshatra" style="display:none">
  <h2>Birth Nakshatra</h2>
  <div id="moonNakshatra"></div>
</div>

<div class="card">
  <h2>Planet Details</h2>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Planet</th>
          <th>Sign</th>
          <th>Degree</th>
          <th>Nakshatra</th>
          <th>Pada</th>
        </tr>
      </thead>
      <tbody id="planetTable"></tbody>
    </table>
  </div>
</div>

<div class="card">
  <h2>Calculation Details</h2>
  <div id="calculationInfo" class="small"></div>
</div>

<p class="small">
  Astrology is a traditional belief system and is not scientifically
  validated as a method of predicting events or personality.
</p>

</div>

<script type="module">

import {
  SwissEphemeris,
  Planet,
  LunarPoint,
  SiderealMode
} from "https://esm.sh/@swisseph/browser@1.3.1";


const nakshatras = [
  "Ashwini", "Bharani", "Krittika",
  "Rohini", "Mrigashira", "Ardra",
  "Punarvasu", "Pushya", "Ashlesha",
  "Magha", "Purva Phalguni", "Uttara Phalguni",
  "Hasta", "Chitra", "Swati",
  "Vishakha", "Anuradha", "Jyeshtha",
  "Mula", "Purva Ashadha", "Uttara Ashadha",
  "Shravana", "Dhanishta", "Shatabhisha",
  "Purva Bhadrapada", "Uttara Bhadrapada",
  "Revati"
];

const signs = [
  "Mesha", "Vrishabha", "Mithuna",
  "Karka", "Simha", "Kanya",
  "Tula", "Vrischika", "Dhanu",
  "Makara", "Kumbha", "Meena"
];

const signEnglish = [
  "Aries", "Taurus", "Gemini",
  "Cancer", "Leo", "Virgo",
  "Libra", "Scorpio", "Sagittarius",
  "Capricorn", "Aquarius", "Pisces"
];

const planetList = [
  ["Sun", Planet.Sun],
  ["Moon", Planet.Moon],
  ["Mars", Planet.Mars],
  ["Mercury", Planet.Mercury],
  ["Jupiter", Planet.Jupiter],
  ["Venus", Planet.Venus],
  ["Saturn", Planet.Saturn]
];

const status = document.getElementById("status");
const table = document.getElementById("planetTable");


function getBirthDetails() {

  const data =
    localStorage.getItem("birthDetails") ||
    sessionStorage.getItem("birthDetails");

  if (!data) {
    throw new Error(
      "Birth details not found. Please enter your birth details first."
    );
  }

  return JSON.parse(data);
}


function getValue(obj, names) {

  for (const name of names) {
    if (obj[name] !== undefined && obj[name] !== null &&
        obj[name] !== "") {
      return obj[name];
    }
  }

  return "";
}


function nakshatraDetails(longitude) {

  longitude = ((longitude % 360) + 360) % 360;

  const nakshatraSize = 360 / 27;
  const padaSize = nakshatraSize / 4;

  const index = Math.floor(longitude / nakshatraSize);

  const positionInNakshatra =
    longitude - index * nakshatraSize;

  const pada =
    Math.floor(positionInNakshatra / padaSize) + 1;

  return {
    name: nakshatras[index],
    pada: pada
  };
}


function positionDetails(longitude) {

  longitude = ((longitude % 360) + 360) % 360;

  const signIndex = Math.floor(longitude / 30);
  const degree = longitude % 30;

  const nak = nakshatraDetails(longitude);

  return {
    sign: signs[signIndex],
    signEnglish: signEnglish[signIndex],
    degree: degree,
    nakshatra: nak.name,
    pada: nak.pada
  };
}


function formatDegree(degree) {

  const whole = Math.floor(degree);
  const minutes = Math.floor((degree - whole) * 60);

  return whole + "° " + String(minutes).padStart(2, "0") + "'";
}

async function getLocation(place) {

  const searches = [
    place,
    "Bengaluru, Karnataka",
    "Bangalore, Karnataka",
    "Bengaluru"
  ];

  for (const name of searches) {

    const url =
      "https://geocoding-api.open-meteo.com/v1/search?name=" +
      encodeURIComponent(name) +
      "&count=20&language=en&format=json&countryCode=IN";

    const response = await fetch(url);

    if (!response.ok) continue;

    const data = await response.json();
    const results = data.results || [];

    const india = results.find(x =>
      x.country_code === "IN" &&
      (
        x.name.toLowerCase() === "bengaluru" ||
        x.name.toLowerCase() === "bangalore"
      )
    );

    if (india) return india;
  }

  throw new Error(
    "Bengaluru, Karnataka could not be located. Check your internet connection."
  );
}

function addRow(name, longitude) {

  const details = positionDetails(longitude);

  const row = document.createElement("tr");

  [
    name,
    details.sign,
    formatDegree(details.degree),
    details.nakshatra,
    details.pada
  ].forEach(value => {

    const cell = document.createElement("td");
    cell.textContent = value;
    row.appendChild(cell);

  });

  table.appendChild(row);

  return details;
}


async function calculate() {

  let swe;

  try {

    status.textContent = "Reading birth details...";

    const birth = getBirthDetails();

    const name = getValue(birth, ["name", "fullName"]);
    const date = getValue(birth, ["date", "dob", "birthDate"]);
    const time = getValue(birth, ["time", "birthTime"]);
    const place = getValue(birth, ["place", "birthPlace", "location"]);

    if (!date || !time || !place) {
      throw new Error(
        "Birth date, time or birthplace is missing in saved details."
      );
    }

    document.getElementById("birthInfo").textContent =
      (name ? name + " | " : "") +
      date + " | " + time + " | " + place;

    status.textContent = "Finding birthplace...";

    const location = await getLocation(place);

    const latitude = location.latitude;
    const longitude = location.longitude;

    status.textContent = "Loading Swiss Ephemeris...";

    swe = new SwissEphemeris();
    await swe.init();

    swe.setSiderealMode(SiderealMode.Lahiri);

    // Birth time is interpreted as Indian Standard Time.
    const birthDate = new Date(
      date + "T" + time + ":00+05:30"
    );

    if (isNaN(birthDate.getTime())) {
      throw new Error("Invalid birth date or time.");
    }

    const jd = swe.dateToJulianDay(birthDate);

    const ayanamsha = swe.getAyanamsa(jd);

    status.textContent = "Calculating planetary positions...";

    table.innerHTML = "";

    const results = [];

    for (const [planetName, planetId] of planetList) {

      const tropical =
        swe.calculatePosition(jd, planetId);

      const siderealLongitude =
        (tropical.longitude - ayanamsha + 360) % 360;

      const details = addRow(
        planetName,
        siderealLongitude
      );

      results.push({
        name: planetName,
        longitude: siderealLongitude,
        ...details
      });

    }

    // Mean lunar node
    const node =
      swe.calculatePosition(jd, LunarPoint.MeanNode);

    const rahuLongitude =
      (node.longitude - ayanamsha + 360) % 360;

    const ketuLongitude =
      (rahuLongitude + 180) % 360;

    const rahuDetails = addRow("Rahu", rahuLongitude);
    const ketuDetails = addRow("Ketu", ketuLongitude);

    results.push({
      name: "Rahu",
      longitude: rahuLongitude,
      ...rahuDetails
    });

    results.push({
      name: "Ketu",
      longitude: ketuLongitude,
      ...ketuDetails
    });

    // Ascendant
    const houses =
      swe.calculateHouses(jd, latitude, longitude);

    const ascendant =
      (houses.ascendant - ayanamsha + 360) % 360;

    const ascDetails = addRow("Ascendant", ascendant);

    results.push({
      name: "Ascendant",
      longitude: ascendant,
      ...ascDetails
    });

    const moon = results.find(x => x.name === "Moon");

    document.getElementById("birthNakshatra").style.display =
      "block";

    document.getElementById("moonNakshatra").innerHTML =
      "<h3>" + moon.nakshatra + " - Pada " +
      moon.pada + "</h3>" +
      "<p>Moon sign: " + moon.sign +
      "</p><p>Moon degree: " +
      formatDegree(moon.degree) + "</p>";

    const savedChart = {
      ...birth,
      julianDay: jd,
      ayanamsha: ayanamsha,
      latitude: latitude,
      longitude: longitude,
      ascendant: ascendant,
      planets: results
    };

    localStorage.setItem(
      "jyotishChart",
      JSON.stringify(savedChart)
    );

    sessionStorage.setItem(
      "jyotishChart",
      JSON.stringify(savedChart)
    );

    document.getElementById("calculationInfo").textContent =
      "Ephemeris: Swiss Ephemeris (Moshier) | " +
      "Ayanamsha: Lahiri | " +
      "Ayanamsha value: " + ayanamsha.toFixed(5) +
      "° | Julian Day: " + jd.toFixed(5) +
      " | Location: " + location.name;

    status.textContent =
      "Calculation completed successfully.";

  } catch (error) {

    status.textContent = "Error: " + error.message;

  } finally {

    if (swe && typeof swe.close === "function") {
      swe.close();
    }

  }
}


document.getElementById("calculateButton")
  .addEventListener("click", calculate);

</script>
</body>
</html>
